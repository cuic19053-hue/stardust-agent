name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-worker-container:
    name: Material Worker 容器运行时冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 构建 Worker 镜像
        run: docker build --platform linux/amd64 -t stardust-material-worker:ci -f infra/material-worker/Dockerfile .

      - name: 验证离线模块导入、中文字体和 SVG 渲染
        run: |
          docker run --rm --platform linux/amd64 \
            --network none --cpus 1 --memory 2g --memory-swap 2g --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --workdir /tmp \
            stardust-material-worker:ci python -c '
          from pathlib import Path
          import shutil
          from proposal.material_export import check_pages
          from proposal.material_figures import FigureSpec, font_path, render_svg
          from proposal.material_worker_proxy import MaterialWorkerBridge
          from utils.layout_audit import audit
          assert Path(font_path()).is_file()
          assert MaterialWorkerBridge
          assert shutil.which("chromium")
          assert shutil.which("libreoffice") or shutil.which("soffice")
          output = Path("/tmp/worker-smoke")
          output.mkdir()
          image = render_svg(FigureSpec(
              id="smoke", section_id="abstract", title="离线容器冒烟测试",
              renderer="svg", nodes=["虚构输入", "虚构输出"]), output)
          assert image.is_file() and image.stat().st_size > 0
          print("worker container imports and SVG rendering passed")
          '

  docs-and-tests:
    name: 文档一致性与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装中文字体（figgen 配图渲染依赖，v2.2 配图规范）
        timeout-minutes: 5
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends fonts-droid-fallback
          # 仅安装 Droid Sans Fallback：它提供 matplotlib 可用的单文件 TTF；
          # fonts-noto-cjk 是 .ttc 集合，matplotlib 不支持且无需额外下载。

      - name: 按锁文件安装开发环境
        run: |
          uv python install
          uv sync --locked --extra full --extra review --group test

      - name: 启动本机工作台并验证首页和 API
        shell: bash
        run: |
          data_dir=$(mktemp -d "$RUNNER_TEMP/stardust-smoke.XXXXXX")
          source_commit=$(git rev-parse HEAD)
          STARDUST_SOURCE_COMMIT="$source_commit" PROPOSAL_AGENT_DATA_DIR="$data_dir" \
            uv run --no-sync uvicorn server.app:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --max-time 3 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/api/ping | jq -e '.status == "ok"'
          GITHUB_STEP_SUMMARY= uv run --no-sync python scripts/check_site_health.py \
            --url http://127.0.0.1:8765/api/ping --expected-commit "$source_commit"
          curl -fsS --max-time 3 http://127.0.0.1:8765/ -o "$data_dir/home.html"
          test -s "$data_dir/home.html"

      - name: 文档一致性门禁（35 个赛道 / README 声称量 / 索引数量 / Agent Skills 规范）
        run: uv run --no-sync python scripts/check_doc_consistency.py --require-skills-ref

      - name: 写作规范注入门禁（35 个子 skill 必须含最新去 AI 味规范块）
        run: uv run --no-sync python scripts/inject_writing_style.py --check

      - name: SKILL.md 完整性门禁（受保护块 / 索引指针 / frontmatter / 重复标题 / 空章节）
        run: uv run --no-sync python scripts/verify_skill_integrity.py

      - name: description 规范门禁（长度 / 何时使用 / triggers / 唯一性 / name 格式）
        run: uv run --no-sync python scripts/check_skill_description.py

      - name: 国家规范与合规门禁（领导人表述 / 文号 / 统计出处 / 时效 / 诚信底线）
        run: uv run --no-sync python scripts/check_compliance.py --strict

      - name: 排版硬指标门禁（references/layout_standard.md，18 条静态条款）
        run: uv run --no-sync python utils/layout_audit.py examples/demos

      - name: 逐赛道验证指南、CLI 生成和工作台 Word 导出
        run: uv run --no-sync python -m pytest tests/test_track_smoke.py -v

      - name: 运行测试
        run: uv run --no-sync python -m pytest tests --ignore=tests/test_track_smoke.py -q -rs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端导出鉴权、状态轮询与上传代理回归
        run: node --test tests/js/*.test.js infra/storage-worker/worker.test.mjs

      - name: 立项医生原型回归
        run: |
          node --test contest/qoder-site/tests/*.test.js
          uv run --no-sync python -m pytest contest/qoder-site/tests/test_model_api.py -q

      - name: 隔离 PostgreSQL 存储配置、CAS、RLS 与计费回归
        timeout-minutes: 5
        run: |
          docker pull postgres:15-alpine
          RUN_POSTGRES_POLICY_TESTS=1 uv run --no-sync python -m pytest \
            tests/test_material_postgres.py \
            tests/test_observability_postgres.py \
            tests/test_trial_policy_postgres.py \
            tests/test_workbench_reconciliation_postgres.py \
            tests/test_user_model_config.py -q

  model-quality:
    name: 模型质量回归
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装锁定的评测依赖
        run: uv sync --locked --extra review
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/stardust-ollama/runtime
            ${{ runner.temp }}/stardust-ollama/models
          key: stardust-ollama-linux-sse42-0.34.1-qwen-65ec06548149-v1
      - name: 准备固定 Ollama 精简 CPU 运行时
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/stardust-ollama/runtime"
          if [[ ! -x "$runtime/bin/ollama" ]]; then
            archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
            trap 'rm -f "$archive"' EXIT
            curl -fsSL --retry 3 --max-time 400 \
              https://github.com/ollama/ollama/releases/download/v0.34.1/ollama-linux-amd64.tar.zst \
              -o "$archive"
            echo "f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034  $archive" | sha256sum -c -
            mkdir -p "$runtime"
            tar --zstd --ignore-zeros -xf "$archive" -C "$runtime" --wildcards \
              bin/ollama lib/ollama/llama-server lib/ollama/libggml-cpu-sse42.so \
              'lib/ollama/libggml-base.so*' 'lib/ollama/libggml.so*' 'lib/ollama/libgomp.so*' \
              'lib/ollama/libllama*.so*' 'lib/ollama/libmtmd.so*'
          fi
      - name: 真实推理与冻结预审回放不得退化
        shell: bash
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/stardust-ollama/models
        run: |
          ollama="$RUNNER_TEMP/stardust-ollama/runtime/bin/ollama"
          "$ollama" serve > "$RUNNER_TEMP/ollama-quality.log" 2>&1 &
          ollama_pid=$!
          trap 'kill "$ollama_pid" 2>/dev/null || true; wait "$ollama_pid" 2>/dev/null || true' EXIT
          curl -fsS --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:11434/api/version
          if ! "$ollama" show qwen2.5:1.5b >/dev/null 2>&1; then
            "$ollama" pull qwen2.5:1.5b
          fi
          uv run --no-sync python -m server.evals.quality_gate --output "$RUNNER_TEMP/quality-results"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: model-quality-results
          path: |
            ${{ runner.temp }}/quality-results
            ${{ runner.temp }}/ollama-quality.log
          if-no-files-found: ignore

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [material-worker-container, docs-and-tests, model-quality]
    env:
      WORKER_RESULT: ${{ needs.material-worker-container.result }}
      TEST_RESULT: ${{ needs.docs-and-tests.result }}
      QUALITY_RESULT: ${{ needs.model-quality.result }}
    steps:
      - name: Require all validation jobs to pass
        run: |
          test "$WORKER_RESULT" = success
          test "$TEST_RESULT" = success
          test "$QUALITY_RESULT" = success
