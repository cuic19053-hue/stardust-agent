name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified 2.2.0 desktop packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the verified 2.2.0 installers
    if: inputs.publish && github.repository == 'cuic19053-hue/stardust-agent' && github.ref == 'refs/heads/codex/desktop-release-publish-2.2.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMMIT: 7d08e38275135e9f448b976d78d5dfdf54f14220
      VERIFIED_RUN: '44854971944'
      VERIFIED_HEAD: 93f000d9b77ea7ac2f43e765cc944ee66f81864f
    steps:
      - name: Verify the successful native build and merged tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" | jq -e --arg head "$VERIFIED_HEAD" --arg repo "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repo and .head_sha == $head and .conclusion == "success" and .path == ".github/workflows/desktop-release.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs" |
            jq -e '[.jobs[] | select(.conclusion == "success") | .name] | sort == ["linux arm64", "linux x64", "mac arm64", "mac x64", "win arm64", "win x64"]'
          gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" |
            jq -e '.status == "identical" or .status == "ahead"'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$RELEASE_COMMIT" --jq '.tree.sha')" = "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$VERIFIED_HEAD" --jq '.tree.sha')"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.VERIFIED_RUN }}
          pattern: stardust-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish one release after verifying all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' desktop/package.json)
          tag="desktop-v${version}"
          assets=()
          cd release-assets
          # Debian calls the x64 architecture amd64. Use x64 in public asset names.
          deb_amd64="Stardust-Agent-${version}-linux-amd64.deb"
          if [[ -f "$deb_amd64" ]]; then
            mv -- "$deb_amd64" "Stardust-Agent-${version}-linux-x64.deb"
          fi
          for arch in arm64 x64; do
            for platform_extension in mac.dmg win.exe linux.deb linux.tar.gz; do
              platform=${platform_extension%%.*}
              extension=${platform_extension#*.}
              file="Stardust-Agent-${version}-${platform}-${arch}.${extension}"
              test -s "$file"
              assets+=("$file")
            done
          done
          sha256sum -- "${assets[@]}" > SHA256SUMS.txt
          assets+=("SHA256SUMS.txt")
          if existing=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json targetCommitish,isDraft 2>/dev/null); then
            jq -e --arg sha "$RELEASE_COMMIT" '.isDraft and .targetCommitish == $sha' <<< "$existing"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$RELEASE_COMMIT" \
              --title "Stardust Agent 桌面客户端 v${version}" --notes-file ../desktop/RELEASE_NOTES.md
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | "\(.digest | sub("^sha256:"; ""))  \(.name)"' | LC_ALL=C sort > uploaded.txt
          { cat SHA256SUMS.txt; sha256sum SHA256SUMS.txt; } | LC_ALL=C sort | diff - uploaded.txt
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest
