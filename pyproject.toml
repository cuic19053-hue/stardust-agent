[project]
name = "stardust-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4",
    "ddgs>=9.0,<10",
    "cryptography>=44,<51",
    "langgraph==1.2.22",
]

[project.optional-dependencies]
worker = [
    "playwright==1.55.0",
    "PyMuPDF>=1.24,<2",
    "Pillow>=11,<13",
    "matplotlib>=3.7,<4",
    "pypdfium2>=4.30,<6",
]
server = [
    "uvicorn[standard]>=0.30",
    "pypdfium2>=4.30",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.18",
    "mcp>=2.0,<3",
]
full = [
    "uvicorn[standard]>=0.30",
    "pypdfium2>=4.30",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.18",
    "mcp>=2.0,<3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]
review = [
    "langgraph-checkpoint-sqlite==3.1.3",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "skills-ref==0.1.1",
]

[tool.uv]
# Newer releases lack native wheels on these platforms.
constraint-dependencies = [
    'cryptography==48.0.1; sys_platform == "darwin" and platform_machine == "x86_64"',
    'cryptography==46.0.3; sys_platform == "win32" and platform_machine == "ARM64"',
    'onnxruntime==1.23.2; sys_platform == "darwin" and platform_machine == "x86_64"',
]

[tool.vercel]
entrypoint = "server.app:app"
